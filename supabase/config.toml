# Public customer sign-up uses service role server-side (avoids Auth /signup 429 limits).
[functions.kk-customer-signup]
verify_jwt = false

# Public contact + Kado Circle email capture (rate-limited; uses Resend when configured).
[functions.kk-send-contact]
verify_jwt = false

# Admin user CRUD — caller must present a valid Supabase admin session JWT.
[functions.kk-admin-users]
verify_jwt = true

# Push notifications — caller must present a valid Supabase session JWT.
[functions.kk-send-push]
verify_jwt = true
