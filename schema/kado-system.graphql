"""
Kado Kohi — durable GraphQL system model (documentation only).

Runtime API remains Supabase:
  Auth JWT → PostgREST / SECURITY DEFINER RPCs (kk_*) → Edge Functions.
Do not treat this file as an executable GraphQL endpoint unless product migrates.

Project: idwtlujcdfnnndxmlaco · Site: https://www.kadokohi.com
Super admin: admin@kadokohi.com
Active branches: branch_marikina (marikina), branch_greenhills (greenhills)
Orders: ALWAYS via kk_place_order — never direct INSERT.
"""

# ─── Enums ───────────────────────────────────────────────────────────────────

enum Role {
  guest
  customer
  barista
  staff
  admin
}

enum BranchStatus {
  active
  coming_soon
}

"""
Wire values in domain.ts / Postgres use hyphens where noted:
  dine_in → "dine-in"
GraphQL underscores are documentation-safe aliases only.
"""
enum OrderChannel {
  online
  """Wire: dine-in"""
  dine_in
  takeout
  pos
  merch
}

enum PaymentMethod {
  """Automated QR Ph via PayMongo hosted checkout. Wire: paymongo"""
  paymongo
  """Manual shop GCash QR + screenshot proof. Wire: gcash-qr"""
  gcash_qr
  """Cash / counter (dine-in, takeout, POS). Wire: pay-at-store"""
  pay_at_store
}

enum PaymentStatus {
  unpaid
  proof_submitted
  paid
  refunded
}

enum OrderStatus {
  pending
  accepted
  preparing
  ready
  served
  completed
  cancelled
}

enum ProductTemperature {
  hot
  iced
  both
}

enum GuestOrderAction {
  cancel
  change_order
}

enum CustomerNotificationKind {
  order
  payment
  marketing
  system
}

enum LoyaltyRewardType {
  free_drink
  discount_percent
  discount_fixed
  free_merch
  custom
}

enum LoyaltyVoucherStatus {
  active
  redeemed
  expired
}

enum PromoCodeType {
  percent
  fixed
  free_drink
  bogo_drink
}

enum BoothBookingKind {
  coffee_cart
  matcha_bar
}

enum BoothBookingStatus {
  submitted
  under_review
  quoted
  awaiting_confirmation
  confirmed
  declined
  cancelled
  completed
}

enum BoothPaymentMethod {
  gcash_qr
  bank_transfer
  gcash_or_bank
}

enum StorageBucket {
  kado_menu_images
  kado_cms_images
  kado_blog_images
  kado_gcash_qr
  kado_payment_proofs
}

"""Route surface / chrome family for RoleGate + layout mapping."""
enum RouteSurface {
  public
  auth
  standalone_guest_order
  customer_account
  barista
  staff
  admin
}

# ─── Identity & branches ─────────────────────────────────────────────────────

type Branch {
  id: ID!
  slug: String!
  name: String!
  address: String!
  city: String!
  status: BranchStatus!
  hours: [BranchHours!]!
  heroImage: String
  lat: Float
  lng: Float
}

type BranchHours {
  day: String!
  open: String!
  close: String!
}

type User {
  id: ID!
  email: String!
  name: String!
  role: Role!
  phone: String
  """Null for admins (all-branch access). Required for barista/staff scoping."""
  branchId: ID
  loyaltyStamps: Int
  createdAt: String!
}

type AuthSession {
  user: User
  loading: Boolean!
}

